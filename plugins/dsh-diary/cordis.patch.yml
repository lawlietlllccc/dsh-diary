# dsh-diary 的 bundle patch。
#
# 这个文件必须留在包里：package.json 的 dsh.bundle.patch 指向它，
# 缺了它插件管理器会拒绝安装（"缺少 patch 文件"）。
#
# 这里只放"哪台机器都一样"的部分：一条 insert 声明。
# 本机专属的值（日记项目根 root）由 scripts/install-diary-plugin.mjs 写进
# 对应 profile 的 cordis.patch.yml 里（按 id 覆盖同名条目），不写在这里。
- insert:
    - id: dsh-diary
      name: 'dsh-diary'
